<text x='30.0' y='62.0' font-size='13' text-anchor='start' fill='#444' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Outline 116.68 x 85.73 mm and corner holes (3.57 mm, 3.885 mm from the short / 3.585 mm from the long edges) = owner calipers 2026-10-26. Connector pads (dots) = owner's 300 dpi bottom scan, +-0.1 mm.</text>
<text x='30.0' y='80.0' font-size='13' text-anchor='start' fill='#444' font-weight='normal' font-family='DejaVu Sans, Arial, sans-serif'>Scan mapped onto the holes; bodies drawn around the pads. Origin = top-left, component side up; the J11 score-harness edge is the bottom. Pin 1 pads are drawn filled.</text>
